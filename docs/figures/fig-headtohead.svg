<svg xmlns="http://www.w3.org/2000/svg" width="820" height="462" viewBox="0 0 820 462" role="img" aria-label="Head to head on 2933 Klebsiella genomes">

  <style>
    .bg    { fill: #ffffff; }
    .ttl   { fill: #0f172a; font: 600 16px system-ui, -apple-system, Segoe UI, sans-serif; }
    .sub   { fill: #64748b; font: 400 12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .lbl   { fill: #334155; font: 400 12.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .val   { fill: #0f172a; font: 600 12.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .mut   { fill: #64748b; font: 400 11.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .cap   { fill: #94a3b8; font: 400 11px system-ui, -apple-system, Segoe UI, sans-serif; }
    .badge { font: 700 10px system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
    .rule  { stroke: #e2e8f0; stroke-width: 1; }
    .axis  { stroke: #cbd5e1; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; } .ttl { fill: #e6edf3; } .sub { fill: #8b949e; }
      .lbl  { fill: #c9d1d9; } .val { fill: #e6edf3; } .mut { fill: #8b949e; }
      .cap  { fill: #6e7681; } .rule { stroke: #21262d; } .axis { stroke: #30363d; }
    }
  </style>

<rect class="bg" width="820" height="462" rx="8"/>
<text class="ttl" x="24" y="32">Head to head on 2933 Klebsiella genomes</text>
<text class="sub" x="24" y="52">same genomes, same databases, same thresholds, matched on locus</text>
<text class="cap" x="300" y="78">HYDRA</text>
<text class="cap" x="470" y="78">BEST OF THE OTHERS</text>
<line class="rule" x1="24" y1="85" x2="796" y2="85"/>
<text class="lbl" x="24" y="104">Whole job, per genome</text>
<text class="val" x="300" y="104">10.8 s</text>
<text class="mut" x="470" y="104">23.3 s, four tools</text>
<rect x="728" y="93" width="53" height="16" rx="8" fill="#10b981"/><text class="badge" x="754.5" y="104" text-anchor="middle">AHEAD</text>
<line class="rule" x1="24" y1="118" x2="796" y2="118"/>
<text class="lbl" x="24" y="137">Tools to run</text>
<text class="val" x="300" y="137">1</text>
<text class="mut" x="470" y="137">4</text>
<rect x="728" y="126" width="53" height="16" rx="8" fill="#10b981"/><text class="badge" x="754.5" y="137" text-anchor="middle">AHEAD</text>
<line class="rule" x1="24" y1="151" x2="796" y2="151"/>
<text class="lbl" x="24" y="170">Sequence type vs recorded answer</text>
<text class="val" x="300" y="170">2933 / 2933</text>
<text class="mut" x="470" y="170">not attempted</text>
<rect x="728" y="159" width="53" height="16" rx="8" fill="#10b981"/><text class="badge" x="754.5" y="170" text-anchor="middle">AHEAD</text>
<line class="rule" x1="24" y1="184" x2="796" y2="184"/>
<text class="lbl" x="24" y="203">Point mutations vs AMRFinderPlus</text>
<text class="val" x="300" y="203">100.0%</text>
<text class="mut" x="470" y="203">AMRFinderPlus reference</text>
<rect x="728" y="192" width="53" height="16" rx="8" fill="#3b82f6"/><text class="badge" x="754.5" y="203" text-anchor="middle">LEVEL</text>
<line class="rule" x1="24" y1="217" x2="796" y2="217"/>
<text class="lbl" x="24" y="236">Colistin, very major errors</text>
<text class="val" x="300" y="236">50</text>
<text class="mut" x="470" y="236">Kleborate 64</text>
<rect x="728" y="225" width="53" height="16" rx="8" fill="#10b981"/><text class="badge" x="754.5" y="236" text-anchor="middle">AHEAD</text>
<line class="rule" x1="24" y1="250" x2="796" y2="250"/>
<text class="lbl" x="24" y="269">Colistin, balanced accuracy</text>
<text class="val" x="300" y="269">0.735</text>
<text class="mut" x="470" y="269">Kleborate 0.666</text>
<rect x="728" y="258" width="53" height="16" rx="8" fill="#10b981"/><text class="badge" x="754.5" y="269" text-anchor="middle">AHEAD</text>
<line class="rule" x1="24" y1="283" x2="796" y2="283"/>
<text class="lbl" x="24" y="302">Ciprofloxacin, balanced accuracy</text>
<text class="val" x="300" y="302">0.832</text>
<text class="mut" x="470" y="302">Kleborate 0.832</text>
<rect x="728" y="291" width="53" height="16" rx="8" fill="#3b82f6"/><text class="badge" x="754.5" y="302" text-anchor="middle">LEVEL</text>
<line class="rule" x1="24" y1="316" x2="796" y2="316"/>
<text class="lbl" x="24" y="335">Gene recall, nine databases</text>
<text class="val" x="300" y="335">100.00%</text>
<text class="mut" x="470" y="335">abricate 100%</text>
<rect x="728" y="324" width="53" height="16" rx="8" fill="#3b82f6"/><text class="badge" x="754.5" y="335" text-anchor="middle">LEVEL</text>
<line class="rule" x1="24" y1="349" x2="796" y2="349"/>
<text class="lbl" x="24" y="368">Sequence type vs Kleborate</text>
<text class="val" x="300" y="368">2933 / 2933</text>
<text class="mut" x="470" y="368">2933 / 2933</text>
<rect x="728" y="357" width="53" height="16" rx="8" fill="#3b82f6"/><text class="badge" x="754.5" y="368" text-anchor="middle">LEVEL</text>
<line class="rule" x1="24" y1="382" x2="796" y2="382"/>
<text class="lbl" x="24" y="401">Virulence score vs Kleborate</text>
<text class="val" x="300" y="401">99.45%</text>
<text class="mut" x="470" y="401">reference</text>
<rect x="728" y="390" width="53" height="16" rx="8" fill="#3b82f6"/><text class="badge" x="754.5" y="401" text-anchor="middle">LEVEL</text>
<rect x="24" y="429" width="10" height="10" rx="2" fill="#10b981"/><text class="cap" x="40" y="438">AHEAD - Hydra is better on this measure</text>
<rect x="360" y="429" width="10" height="10" rx="2" fill="#3b82f6"/><text class="cap" x="376" y="438">LEVEL - the two agree, neither is behind</text>
</svg>