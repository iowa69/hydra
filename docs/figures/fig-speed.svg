<svg xmlns="http://www.w3.org/2000/svg" width="820" height="214" viewBox="0 0 820 214" role="img" aria-label="One pass instead of four">

  <style>
    .bg    { fill: #ffffff; }
    .ttl   { fill: #0f172a; font: 600 16px system-ui, -apple-system, Segoe UI, sans-serif; }
    .sub   { fill: #64748b; font: 400 12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .lbl   { fill: #334155; font: 400 12.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .val   { fill: #0f172a; font: 600 12.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .mut   { fill: #64748b; font: 400 11.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .cap   { fill: #94a3b8; font: 400 11px system-ui, -apple-system, Segoe UI, sans-serif; }
    .badge { font: 700 10px system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
    .rule  { stroke: #e2e8f0; stroke-width: 1; }
    .axis  { stroke: #cbd5e1; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; } .ttl { fill: #e6edf3; } .sub { fill: #8b949e; }
      .lbl  { fill: #c9d1d9; } .val { fill: #e6edf3; } .mut { fill: #8b949e; }
      .cap  { fill: #6e7681; } .rule { stroke: #21262d; } .axis { stroke: #30363d; }
    }
  </style>

<rect class="bg" width="820" height="214" rx="8"/>
<text class="ttl" x="24" y="32">One pass instead of four</text>
<text class="sub" x="24" y="52">2933 genomes, same machine</text>
<rect x="24.0" y="88" width="313.0" height="28" fill="#3b82f6" opacity="0.88"/>
<rect x="337.0" y="88" width="302.4" height="28" fill="#8b5cf6" opacity="0.88"/>
<rect x="639.3" y="88" width="152.3" height="28" fill="#f59e0b" opacity="0.88"/>
<rect x="791.7" y="88" width="4.3" height="28" fill="#94a3b8" opacity="0.88"/>
<text class="lbl" x="24" y="82">Four tools, run one after another</text>
<text class="val" x="796" y="82" text-anchor="end">23.3 s per genome</text>
<rect x="24" y="127" width="10" height="10" rx="2" fill="#3b82f6"/><text class="cap" x="40" y="136">amrfinder 9.4 s</text>
<rect x="167.0" y="127" width="10" height="10" rx="2" fill="#8b5cf6"/><text class="cap" x="183.0" y="136">kleborate 9.1 s</text>
<rect x="310.0" y="127" width="10" height="10" rx="2" fill="#f59e0b"/><text class="cap" x="326.0" y="136">abricate x9 4.6 s</text>
<rect x="467.0" y="127" width="10" height="10" rx="2" fill="#94a3b8"/><text class="cap" x="483.0" y="136">mlst 0.1 s</text>
<text class="lbl" x="24" y="170">Hydra, all of it in one pass</text>
<rect x="24" y="176" width="357.7" height="28" rx="2" fill="#10b981"/>
<text class="badge" x="40" y="194">2.2x FASTER</text>
<text class="val" x="796" y="170" text-anchor="end">10.8 s per genome</text>
</svg>