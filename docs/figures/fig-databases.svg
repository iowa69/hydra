<svg xmlns="http://www.w3.org/2000/svg" width="760" height="332" viewBox="0 0 760 332" role="img" aria-label="Gene calls against abricate 1.4.0">

  <style>
    .bg   { fill: #ffffff; }
    .ttl  { fill: #0f172a; font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .sub  { fill: #64748b; font: 400 12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .lbl  { fill: #334155; font: 400 12.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .val  { fill: #0f172a; font: 600 12.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .tick { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .ttl  { fill: #e6edf3; }
      .sub  { fill: #8b949e; }
      .lbl  { fill: #c9d1d9; }
      .val  { fill: #e6edf3; }
      .tick { stroke: #21262d; }
    }
  </style>

<rect class="bg" width="760" height="332" rx="8"/>
<text class="ttl" x="24" y="30">Gene calls against abricate 1.4.0</text>
<text class="sub" x="24" y="49">same database, same 667 genomes, one database per run - mean Jaccard</text>
<text class="lbl" x="24" y="87">ecoh</text>
