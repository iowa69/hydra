<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="Sequence typing">

  <style>
    .bg   { fill: #ffffff; }
    .ttl  { fill: #0f172a; font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .sub  { fill: #64748b; font: 400 12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .lbl  { fill: #334155; font: 400 12.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .val  { fill: #0f172a; font: 600 12.5px system-ui, -apple-system, Segoe UI, sans-serif; }
    .tick { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .ttl  { fill: #e6edf3; }
      .sub  { fill: #8b949e; }
      .lbl  { fill: #c9d1d9; }
      .val  { fill: #e6edf3; }
      .tick { stroke: #21262d; }
    }
  </style>

<rect class="bg" width="760" height="230" rx="8"/>
<text class="ttl" x="24" y="30">Sequence typing</text>
<text class="sub" x="24" y="49">bar length is the number of genomes measured</text>
<text class="lbl" x="24" y="87">Published genomes, ST known ahead</text>
<rect x="286" y="75" width="348.0" height="16" rx="3" fill="#14b8a6" opacity="0.95"/>
<text class="val" x="644.0" y="88">2933 / 2933    100%</text>
<text class="lbl" x="24" y="121">Clinical isolates, vs mlst 2.35.0</text>
<rect x="286" y="109" width="151.8" height="16" rx="3" fill="#14b8a6" opacity="0.72"/>
<text class="val" x="447.8" y="122">1279 / 1279    100%</text>
<text class="lbl" x="24" y="155">Published genomes, vs mlst 2.35.0</text>
<rect x="286" y="143" width="348.0" height="16" rx="3" fill="#14b8a6" opacity="0.72"/>
<text class="val" x="644.0" y="156">2931 / 2933    99.93%</text>
<text class="lbl" x="24" y="189">Closed references, vs mlst 2.35.0</text>
<rect x="286" y="177" width="79.1" height="16" rx="3" fill="#14b8a6" opacity="0.72"/>
<text class="val" x="375.1" y="190">666 / 667    99.85%</text>
</svg>