<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hydra">
  <title>Hydra</title>
  <desc>An H whose uprights rise into two serpent heads</desc>
  <defs>
    <linearGradient id="hydraTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#hydraTile)"/>

  <!-- The monogram is one white silhouette: uprights, crossbar and the two
       heads overlap, so they read as a single continuous creature. Each head
       is a teardrop - wide at the jaw, tapering to the snout - turned outward. -->
  <g fill="#ffffff">
    <rect x="146" y="150" width="62" height="254" rx="26"/>
    <rect x="304" y="150" width="62" height="254" rx="26"/>
    <rect x="146" y="256" width="220" height="58" rx="26"/>
    <g transform="translate(177 158) rotate(-27)">
      <path d="M 0 -60 C 20 -52 38 -30 38 -6 C 38 20 21 38 0 38
               C -21 38 -38 20 -38 -6 C -38 -30 -20 -52 0 -60 Z"/>
    </g>
    <g transform="translate(335 158) rotate(27)">
      <path d="M 0 -60 C 20 -52 38 -30 38 -6 C 38 20 21 38 0 38
               C -21 38 -38 20 -38 -6 C -38 -30 -20 -52 0 -60 Z"/>
    </g>
  </g>

  <!-- One eye per head, cut back to the tile colour: a serpent seen from the
       side shows one eye, and two would read as a face looking outward. -->
  <g fill="url(#hydraTile)">
    <ellipse cx="164" cy="140" rx="9" ry="11" transform="rotate(-27 164 140)"/>
    <ellipse cx="348" cy="140" rx="9" ry="11" transform="rotate(27 348 140)"/>
  </g>
</svg>
