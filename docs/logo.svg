<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hydra">
  <title>Hydra</title>
  <desc>An H whose uprights rise into two serpent heads</desc>
  <defs>
    <linearGradient id="hydraTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#hydraTile)"/>

  <!-- Uprights, crossbar and heads are one white silhouette, so they read as a
       single creature rather than a letter with things stuck on it. Each head
       overlaps the top of its upright and is turned outward, which keeps the
       pair from reading as a face. -->
  <g fill="#ffffff">
    <rect x="152" y="152" width="62" height="250" rx="31"/>
    <rect x="298" y="152" width="62" height="250" rx="31"/>
    <rect x="152" y="250" width="208" height="58" rx="29"/>
    <g transform="translate(173 152) rotate(-24)">
      <path d="M 0 -59 C 22 -52 36 -20 36 8 C 36 31 23 39 0 39
               C -23 39 -36 31 -36 8 C -36 -20 -22 -52 0 -59 Z"/>
    </g>
    <g transform="translate(339 152) rotate(24)">
      <path d="M 0 -59 C 22 -52 36 -20 36 8 C 36 31 23 39 0 39
               C -23 39 -36 31 -36 8 C -36 -20 -22 -52 0 -59 Z"/>
    </g>
  </g>

  <!-- One eye per head, cut back to the tile colour and set on the outer side.
       A serpent in profile shows one eye; two would look forward and turn the
       mark into a face. Below about 32px these drop out and it degrades to a
       plain H, which is the intended fallback. -->
  <g fill="url(#hydraTile)">
    <g transform="translate(173 152) rotate(-24)"><ellipse cx="-12" cy="-4" rx="8" ry="10"/></g>
    <g transform="translate(339 152) rotate(24)"><ellipse cx="12" cy="-4" rx="8" ry="10"/></g>
  </g>
</svg>
