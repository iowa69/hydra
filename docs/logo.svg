<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hydra">
  <title>Hydra</title>
  <desc>A five-headed serpent on one body, inside a plasmid ring, flanked by bacterial rods</desc>
  <rect width="512" height="512" rx="116" fill="#0b1220"/>
  <g fill="#22d3ee" color="#22d3ee">
  <!-- The ring is a plasmid: closed circular DNA, which is how most
       acquired resistance actually travels between bacteria. -->
    <circle cx="256" cy="256" r="186" fill="none" stroke="currentColor" stroke-width="22"/>
  <!-- Necks first, then one body they all grow from, then the heads on
       top, so the whole creature reads as a single silhouette. -->
    <path d="M 256 366 Q 181 313 138 262" stroke-width="32" fill="none" stroke="currentColor" stroke-linecap="round"/>
    <path d="M 256 366 Q 215 293 192 225" stroke-width="32" fill="none" stroke="currentColor" stroke-linecap="round"/>
    <path d="M 256 366 Q 256 286 256 212" stroke-width="32" fill="none" stroke="currentColor" stroke-linecap="round"/>
    <path d="M 256 366 Q 297 293 320 225" stroke-width="32" fill="none" stroke="currentColor" stroke-linecap="round"/>
    <path d="M 256 366 Q 331 313 374 262" stroke-width="32" fill="none" stroke="currentColor" stroke-linecap="round"/>
    <ellipse cx="256" cy="376" rx="52" ry="24"/>
    <g transform="translate(138 262) rotate(-46)"><path d="M 0 -48 C 16 -42 29 -15 29 7 C 29 28 18 34 0 34 C -18 34 -29 28 -29 7 C -29 -15 -16 -42 0 -48 Z"/></g>
    <g transform="translate(192 225) rotate(-23)"><path d="M 0 -48 C 16 -42 29 -15 29 7 C 29 28 18 34 0 34 C -18 34 -29 28 -29 7 C -29 -15 -16 -42 0 -48 Z"/></g>
    <g transform="translate(256 212) rotate(0)"><path d="M 0 -48 C 16 -42 29 -15 29 7 C 29 28 18 34 0 34 C -18 34 -29 28 -29 7 C -29 -15 -16 -42 0 -48 Z"/></g>
    <g transform="translate(320 225) rotate(23)"><path d="M 0 -48 C 16 -42 29 -15 29 7 C 29 28 18 34 0 34 C -18 34 -29 28 -29 7 C -29 -15 -16 -42 0 -48 Z"/></g>
    <g transform="translate(374 262) rotate(46)"><path d="M 0 -48 C 16 -42 29 -15 29 7 C 29 28 18 34 0 34 C -18 34 -29 28 -29 7 C -29 -15 -16 -42 0 -48 Z"/></g>
  <!-- Two bacilli, set well inside the ring so they read as cells
       rather than as ticks on it. -->
    <rect x="-11" y="-26" width="22" height="52" rx="11" transform="translate(166 352) rotate(26)"/>
    <rect x="-11" y="-26" width="22" height="52" rx="11" transform="translate(346 352) rotate(-26)"/>
  <!-- One eye per head, cut back to the badge colour. Below ~32px they
       drop out and the mark degrades to a clean silhouette. -->
    <g transform="translate(138 262) rotate(-46)"><ellipse cx="-8" cy="-2" rx="6" ry="8" fill="#0b1220"/></g>
    <g transform="translate(192 225) rotate(-23)"><ellipse cx="-8" cy="-2" rx="6" ry="8" fill="#0b1220"/></g>
    <g transform="translate(256 212) rotate(0)"><ellipse cx="8" cy="-2" rx="6" ry="8" fill="#0b1220"/></g>
    <g transform="translate(320 225) rotate(23)"><ellipse cx="8" cy="-2" rx="6" ry="8" fill="#0b1220"/></g>
    <g transform="translate(374 262) rotate(46)"><ellipse cx="8" cy="-2" rx="6" ry="8" fill="#0b1220"/></g>
  </g>
</svg>
