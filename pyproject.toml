[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-amr"
version = "1.0.0"
description = "Hydra - unified AMR, virulence, point-mutation, MLST and lineage typing from assemblies and raw reads"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Hydra developers"}]
keywords = ["amr", "antimicrobial resistance", "mlst", "virulence", "bacteria", "genomics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
]

[project.optional-dependencies]
reads = ["pysam>=0.19"]
cluster = ["scipy>=1.7"]
excel = ["openpyxl>=3.0"]
all = ["pysam>=0.19", "scipy>=1.7", "openpyxl>=3.0"]

[project.scripts]
hydra = "hydra.cli:main"

[project.urls]
Homepage = "https://github.com/hydra-amr/hydra"
Documentation = "https://github.com/hydra-amr/hydra#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hydra = ["data/**/*"]
