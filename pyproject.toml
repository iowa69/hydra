[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-amr"
version = "1.4.0"
description = "Hydra - unified AMR, virulence, point-mutation, MLST and lineage typing from assemblies and raw reads"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "Giovanni Lorenzin"}]
maintainers = [{name = "Giovanni Lorenzin"}]
keywords = ["amr", "antimicrobial resistance", "mlst", "virulence", "bacteria", "genomics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
]

[project.optional-dependencies]
reads = ["pysam>=0.19"]
cluster = ["scipy>=1.7"]
excel = ["openpyxl>=3.0"]
all = ["pysam>=0.19", "scipy>=1.7", "openpyxl>=3.0"]

[project.scripts]
hydra = "hydra_amr.cli:main"

[project.urls]
Homepage = "https://github.com/iowa69/hydra"
Documentation = "https://github.com/iowa69/hydra#readme"

[tool.pytest.ini_options]
# Without a pytest section here, pytest walks up from the test file looking for
# a configuration file and will happily adopt the pyproject.toml of whatever
# project a clone of Hydra happens to sit inside -- which sets that project's
# rootdir and import path, so `import hydra_amr` resolves to a different
# checkout, or to nothing. Declaring the section makes this file the rootdir.
pythonpath = ["src"]
testpaths = ["tests"]
# src/ first, so a clone is tested against its own source and never against a
# copy of hydra_amr installed in the environment.
addopts = "-q --import-mode=prepend"
filterwarnings = ["default"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hydra_amr = ["data/**/*"]
