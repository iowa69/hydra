{% set name = "hydra-amr" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - hydra = hydra_amr.cli:main
  # Bioconda requires this on every recipe, noarch included.
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
  run:
    - python >=3.9
    - pandas >=1.3
    - numpy >=1.20
    - scipy >=1.7
    - pysam >=0.19
    - openpyxl >=3.0
    - blast >=2.12
    - minimap2 >=2.24
    - samtools >=1.15
    - mash >=2.3

test:
  # Every module, not just the packages: a missing submodule imports fine through
  # its package and fails at the first run that needs it.
  imports:
    - hydra_amr
    - hydra_amr.__main__
    - hydra_amr.cli
    - hydra_amr.config
    - hydra_amr.pipeline
    - hydra_amr.presets
    - hydra_amr.records
    - hydra_amr.seqio
    - hydra_amr.utils
    - hydra_amr.db
    - hydra_amr.db.fetch
    - hydra_amr.db.manager
    - hydra_amr.db.registry
    - hydra_amr.engines
    - hydra_amr.engines.blast
    - hydra_amr.engines.mutations
    - hydra_amr.engines.nucl
    - hydra_amr.engines.protein
    - hydra_amr.engines.reads
    - hydra_amr.report
    - hydra_amr.report.html
    - hydra_amr.report.tables
    - hydra_amr.report.writer
    - hydra_amr.typing
    - hydra_amr.typing.cassette
    - hydra_amr.typing.lineage
    - hydra_amr.typing.mlst
    - hydra_amr.typing.species
  commands:
    - hydra --version
    - hydra --help
    - hydra run --help
    - hydra screen --help
    - hydra db --help
    - hydra db download --list
    - hydra presets
    - hydra presets deep
    # The packaged data file the species/scheme mapping is read from. Without it
    # every MLST scheme loses its organism and the species call degrades silently,
    # which is exactly the kind of loss a package test should catch.
    - python -c "import hydra_amr, pathlib, sys; p = pathlib.Path(hydra_amr.__file__).parent / 'data' / 'scheme_species.tsv'; sys.exit(0 if p.is_file() and p.stat().st_size > 0 else 1)"
    # The rule tables that drive organism-scoped typing must survive packaging.
    - python -c "from hydra_amr.typing.cassette import SCHEMES; assert 'SCCmec' in SCHEMES"
    - python -c "from hydra_amr.engines.protein import LOSS_OF_FUNCTION as L; assert {'mgrB','ompK35','ompK36','cirA','ramR','nfsB'} <= set(L)"
    - python -c "from hydra_amr.db.registry import DATABASES, DB_GROUPS; assert 'sccmec' in DATABASES and 'sccmec' not in DB_GROUPS['all']"
    - python -c "from hydra_amr.presets import PRESETS; assert {'fast','standard','deep','surveillance','linezolid'} <= set(PRESETS)"
    # The external tools Hydra shells out to, so a broken environment fails here
    # rather than four stages into someone's first run.
    - blastn -version
    - blastx -version
    - makeblastdb -version
    - minimap2 --version
    - samtools --version
    - mash --version

about:
  home: https://github.com/iowa69/hydra
  license: MIT
  license_family: MIT
  license_file: ../LICENSE
  summary: Unified AMR, virulence, point-mutation, heteroresistance, MLST and lineage typing
  description: |
    Hydra screens bacterial assemblies and raw reads for acquired resistance and
    virulence genes, organism-specific resistance point mutations, multi-locus
    sequence types and lineage typing schemes, in one pass over one set of
    databases, replacing a pipeline of four or five single-purpose tools.

    It reports heteroresistance directly from reads: allele fractions are
    measured at every catalogued mutation position, so a resistance mutation
    carried by only some copies of a multi-copy locus - the usual situation for
    the 23S rRNA mutations behind linezolid resistance - is detected even though
    the assembly consensus is wild type. A FASTQ-only sample is also sequence
    typed, by mapping reads to the scheme's loci and reading the consensus back
    against every allele, and each resistance gene it carries is compared with
    the closest reference so its mutations are reported with the fraction of
    reads supporting them.

    Typing follows the organism: SCCmec cassette type for staphylococci, MLST from
    every installed PubMLST scheme with the scheme chosen automatically, and the
    Klebsiella lineage loci. Where losing a gene is the resistance mechanism rather
    than gaining one - mgrB and colistin, ompK35/ompK36 and the carbapenems, cirA,
    ramR - the disruption itself is detected and reported.

    Acquired genes are screened against NCBI, CARD, ResFinder, ARG-ANNOT,
    MEGARes, VFDB, PlasmidFinder, EcOH and E. coli VF together, with curated
    drug-class and gene-family annotation transferred onto every one of them.
    Results come out as TSV, CSV, JSON, XLSX or a self-contained HTML report
    with clustered heatmaps, pivoted on samples or genes, showing
    presence/absence, percent identity, coverage, read depth or allele fraction,
    plus flat one-row-per-hit layouts that existing downstream scripts can read.

    Reference databases are not redistributed. After installation, `hydra db
    import` builds them from reference data already present on the machine, and
    `hydra db bundle` packs them for machines that have neither that data nor a
    network.

  doc_url: https://github.com/iowa69/hydra#readme
  dev_url: https://github.com/iowa69/hydra

extra:
  recipe-maintainers:
    - iowa69
